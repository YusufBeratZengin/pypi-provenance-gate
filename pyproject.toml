[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pypi-provenance-gate"
version = "0.1.0"
description = "Check PEP 740 provenance for every package in your lockfile and catch regressions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuf Berat Zengin" }]
keywords = ["pypi", "pep-740", "attestations", "supply-chain-security", "provenance", "lockfile"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
provenance-gate = "pypi_provenance_gate.cli:main"

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/pypi-provenance-gate"
Documentation = "https://github.com/YusufBeratZengin/pypi-provenance-gate#readme"
Issues = "https://github.com/YusufBeratZengin/pypi-provenance-gate/issues"
Changelog = "https://github.com/YusufBeratZengin/pypi-provenance-gate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/pypi_provenance_gate"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "README.tr.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]
# Turkish messages intentionally contain ı/İ/ş/ğ; RUF001-003 are noise here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011", "PT018", "RUF012", "RUF059", "E501", "I001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pypi_provenance_gate"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
